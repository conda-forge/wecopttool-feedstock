{% set name = "wecopttool" %}
{% set version = "3.3.0" %}
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f88d483aee87d9cdecb0227dff899d35644a33ec0e9672996d6efb0ad8201c9f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }},<3.12
    - pip
    - numpy >=1.20
    - scipy
    - xarray
    - jax
    - capytaine
    - joblib
    - wavespectra >=3.13
    - netcdf4

test:
  imports:
    - wecopttool
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/sandialabs/WecOptTool
  summary: WEC Design Optimization Toolbox
  description: |
    The Wave Energy Converter Design Optimization Toolbox (WecOptTool)
    allows users to perform wave energy converter (WEC) device design
    optimization studies with constrained optimal control.
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  doc_url: https://sandialabs.github.io/WecOptTool

extra:
  recipe-maintainers:
    - rgcoe
    - cmichelenstrofer
    - michaelcdevin
    - jtgrasb
