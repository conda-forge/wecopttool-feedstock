{% set name = "wecopttool" %}
{% set version = "3.3.0" %}
{% set python_min = "3.11" %}
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f88d483aee87d9cdecb0227dff899d35644a33ec0e9672996d6efb0ad8201c9f

build:
  noarch: python
  script:
    # Relax upstream PyPI metadata because conda-forge currently has pym4e 2.0.0,
    # while upstream wecopttool 3.3.0 pins pym4e==2.1.1.
    - sed -i 's/pym4e==2.1.1/pym4e>=2.0.0,<2.2/g' pyproject.toml 
    - {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }},<3.13
    - pip
    - numpy >=1.20
    - scipy
    - xarray
    - jax
    - capytaine ==2.3.1
    - joblib
    - wavespectra >=4.0
    - netcdf4
    - pym4e >=2.0.0,<2.2

test:
  imports:
    - wecopttool
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/sandialabs/WecOptTool
  summary: WEC Design Optimization Toolbox
  description: |
    The Wave Energy Converter Design Optimization Toolbox (WecOptTool)
    allows users to perform wave energy converter (WEC) device design
    optimization studies with constrained optimal control.
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  doc_url: https://sandialabs.github.io/WecOptTool

extra:
  recipe-maintainers:
    - rgcoe
    - cmichelenstrofer
    - michaelcdevin
    - jtgrasb
